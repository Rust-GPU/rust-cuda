# Compiler Explorer -- rust-cuda default properties
#
# This file defines how the rust-cuda "compiler" appears in the Compiler
# Explorer UI.  It is loaded by CE's configuration layer; see
# https://github.com/compiler-explorer/compiler-explorer/blob/main/docs/AddingACompiler.md

# ---------------------------------------------------------------------------
# Compiler identity
# ---------------------------------------------------------------------------
compilerType=rust-cuda
group=rust-cuda
groupName=Rust CUDA (rust-cuda)

# The wrapper script that Godbolt executes.  install.sh places it here.
compiler=/opt/compiler-explorer/rust-cuda/bin/rust-cuda-wrapper.sh

# Language shown in the UI dropdown.
lang=rust

# Human-readable name in the compiler selector.
name=rust-cuda main (llvm7)

# Semantic version used for sorting in the compiler list.
semver=main

# ---------------------------------------------------------------------------
# Behaviour
# ---------------------------------------------------------------------------

# The wrapper always writes PTX to stdout and diagnostics to stderr.
compilerShouldNotProduceOutput=true

# Godbolt options pane entries (shown as dropdowns / checkboxes).
options=--emit=ptx

# Default flags passed on every invocation.
defaultOptions=--emit=ptx --opt-level=3

# CE will offer these in the "Compiler options" box as suggestions.
supportedOptions=--emit=ptx --emit=llvm-ir --opt-level=0 --opt-level=3 --gpu-arch=sm_52 --gpu-arch=sm_70 --gpu-arch=sm_75 --gpu-arch=sm_80 --gpu-arch=sm_86 --gpu-arch=sm_89 --gpu-arch=sm_90

# Output is PTX assembly (NVIDIA's ISA-level text format).
outputIsAsm=true

# Do not try to demangle -- PTX symbols are already human-readable.
demangler=

# No binary output to disassemble.
supportsBinary=false

# No execution support (GPU code cannot run on the CE host).
supportsExecute=false

# The --version flag is handled by the wrapper.
versionFlag=--version
versionRe=rust-cuda-wrapper.*

# Instruction-set reference for hover tooltips.
instructionSet=ptx

# ---------------------------------------------------------------------------
# Source boilerplate
# ---------------------------------------------------------------------------
# The default source shown when a user picks this compiler.
defaultSource=use cuda_std::prelude::*;\n\n#[kernel]\n#[allow(improper_ctypes_definitions, clippy::missing_safety_doc)]\npub unsafe fn vecadd(a: &[f32], b: &[f32], c: *mut f32) {\n    let idx = thread::index_1d() as usize;\n    if idx < a.len() {\n        let elem = unsafe { &mut *c.add(idx) };\n        *elem = a[idx] + b[idx];\n    }\n}
